plugins {
    id 'com.android.application' version '8.10.1'
}

repositories {
    google()
    mavenCentral()
}

configurations { natives }

def signingProperties = new Properties()
def signingPropertiesFile = file('signing.properties')
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    packaging { resources.excludes += ['native-archive/windows-x86_64/**'] }
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    namespace = 'top.totodile.pokemmo.android'
    compileSdk = 36
    // 参考 Android 工程：资源包本身已压缩，APK 中直接存储，避免重复压缩及其内存开销。
    androidResources { noCompress += ['zip'] }
    defaultConfig {
        applicationId 'top.totodile.pokemmo'
        minSdk = 26
        targetSdk = 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        projectKey {
            storeFile file('signing/pokemmo.keystore')
            storePassword signingProperties.getProperty('storePassword')
            keyAlias signingProperties.getProperty('keyAlias')
            keyPassword signingProperties.getProperty('keyPassword')
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.projectKey }
        release { signingConfig signingConfigs.projectKey }
    }
    sourceSets.main {
        res.srcDir layout.buildDirectory.dir('generated/iconRes')
        assets.srcDirs = [layout.buildDirectory.dir('generated/bundledAssets')]
        jniLibs.srcDirs = [layout.buildDirectory.dir('generated/jniLibs'), 'native-tools']
        assets.srcDir 'native-tools/licenses'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation project(':server:db:android')
    implementation project(':server:login')
    implementation(project(':client:core')) { exclude group: 'net.java.dev.jna', module: 'jna' }
    implementation 'net.java.dev.jna:jna:5.17.0@aar'
    implementation "com.badlogicgames.gdx:gdx-backend-android:${rootProject.gdxVersion}"
    natives "com.badlogicgames.gdx:gdx-platform:${rootProject.gdxVersion}:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:${rootProject.gdxVersion}:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:${rootProject.gdxVersion}:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:${rootProject.gdxVersion}:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:${rootProject.gdxVersion}:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:${rootProject.gdxVersion}:natives-x86_64"
}

// 首次安装也加载原名的完整主题；APK 内保留 data 下的资源相对路径。
abstract class BundleAndroidResources extends DefaultTask {
    @Internal
    abstract DirectoryProperty getDataDirectory()
    @InputFiles @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getResourceFiles()
    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void bundle() {
        def root = dataDirectory.get().asFile.toPath()
        def output = outputDirectory.get().asFile
        def expectedOutput = project.layout.buildDirectory.dir('generated/bundledAssets').get().asFile.canonicalFile
        if (output.canonicalFile != expectedOutput) {
            throw new GradleException('Bundled assets must remain in the generated output directory.')
        }
        project.delete(output)
        output.mkdirs()
        def files = resourceFiles.files.collect { it.toPath() }.sort()
        def entries = []
        new java.util.zip.ZipOutputStream(new FileOutputStream(new File(output, 'resources.zip'))).withCloseable { zip ->
            files.each { path ->
                def relative = root.relativize(path).toString().replace('\\', '/')
                if (relative.startsWith('themes/') || relative.startsWith('sprites/atlas/')
                        || relative ==~ /sprites\/textures\/bg_0[0-2]\.png/) {
                    def startup = new File(output, 'startup/' + relative).toPath()
                    java.nio.file.Files.createDirectories(startup.getParent())
                    java.nio.file.Files.copy(path, startup, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
                def name = 'data/' + relative
                def entry = new java.util.zip.ZipEntry(name)
                entry.setTime(0)
                zip.putNextEntry(entry)
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                java.nio.file.Files.newInputStream(path).withCloseable { input ->
                    byte[] buffer = new byte[131072]
                    int count
                    while ((count = input.read(buffer)) != -1) {
                        digest.update(buffer, 0, count)
                        zip.write(buffer, 0, count)
                    }
                }
                zip.closeEntry()
                entries.add([path: name, size: java.nio.file.Files.size(path), sha256: digest.digest().encodeHex().toString()])
            }
        }
        def content = groovy.json.JsonOutput.toJson(entries)
        def revision = java.security.MessageDigest.getInstance('SHA-256').digest(content.getBytes('UTF-8')).encodeHex().toString()
        new File(output, 'manifest.json').setText(groovy.json.JsonOutput.toJson([revision: revision, files: entries]), 'UTF-8')
    }
}

tasks.register('bundleResources', BundleAndroidResources) {
    dataDirectory.set(project(':client').layout.projectDirectory.dir('data'))
    // 用户导入内容由运行时单独管理，不能作为客户端内置资源分发。
    resourceFiles.from(project(':client').fileTree('data') {
        exclude '**/mods/**', '**/roms/**'
    })
    outputDirectory.set(layout.buildDirectory.dir('generated/bundledAssets'))
}

// 不允许因凭据缺失而生成未签名 APK，或回退到其他电脑的默认调试密钥。
def projectKeyFile = file('signing/pokemmo.keystore')
def checkProjectSigning = tasks.register('checkProjectSigning') {
    doLast {
        if (!projectKeyFile.isFile() || ['storePassword', 'keyAlias', 'keyPassword'].any {
            !signingProperties.getProperty(it)?.trim()
        }) {
            throw new GradleException('Missing project signing key or credentials. Copy client/android/signing/pokemmo.keystore and client/android/signing.properties from the signing-key backup.')
        }
    }
}
tasks.matching { it.name == 'packageDebug' || it.name == 'packageRelease' }.configureEach {
    dependsOn checkProjectSigning
}

// 从 LibGDX 原生依赖中提取各架构的共享库，交给 Android 插件打包。
abstract class ExtractAndroidNatives extends DefaultTask {
    @Classpath
    abstract ConfigurableFileCollection getNativeJars()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @javax.inject.Inject
    abstract org.gradle.api.file.FileSystemOperations getFileSystemOperations()

    @javax.inject.Inject
    abstract org.gradle.api.file.ArchiveOperations getArchiveOperations()

    @TaskAction
    void extract() {
        def jars = nativeJars.files
        def archives = archiveOperations
        fileSystemOperations.sync {
            into outputDirectory.get().asFile
            jars.each { nativeJar ->
                def abi = nativeJar.name.replaceFirst(/^.*natives-/, '').replaceFirst(/\.jar$/, '')
                from(archives.zipTree(nativeJar)) {
                    include '*.so'
                    into abi
                }
            }
        }
    }
}

tasks.register('extractNatives', ExtractAndroidNatives) {
    nativeJars.from(configurations.natives)
    outputDirectory.set(layout.buildDirectory.dir('generated/jniLibs'))
}
// 从共用图标生成 Android 资源，避免手动维护另一份 PNG。
tasks.register('copyLauncherIcon', Sync) {
    from(project(':client').layout.projectDirectory.file('data/icons/128x128.png')) {
        into 'drawable-nodpi'
        rename { 'ic_launcher.png' }
    }
    into layout.buildDirectory.dir('generated/iconRes')
}
tasks.named('preBuild') {
    dependsOn tasks.named('extractNatives'), tasks.named('copyLauncherIcon'), tasks.named('bundleResources')
}

tasks.register('copyApk', Copy) {
    inputs.property('apkFileName', 'PokeMMO.apk')
    group = 'build'
    description = '生成可直接安装的 Android 调试 APK。'
    dependsOn 'assembleDebug'
    from layout.buildDirectory.file('outputs/apk/debug/android-debug.apk')
    into layout.buildDirectory.dir('apk')
    rename { 'PokeMMO.apk' }
}

tasks.named('build') {
    dependsOn tasks.named('copyApk')
}

// 每次执行都重新查询设备；单台安装失败后继续处理其他设备，最后汇总结果。
abstract class InstallAllDevices extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getAdbFile()

    @InputFile
    abstract RegularFileProperty getApkFile()

    @javax.inject.Inject
    abstract org.gradle.process.ExecOperations getExecOperations()

    @TaskAction
    void installAll() {
        def listing = new ByteArrayOutputStream()
        execOperations.exec {
            commandLine adbFile.get().asFile.absolutePath, 'devices'
            standardOutput = listing
        }.assertNormalExitValue()

        def devices = []
        listing.toString('UTF-8').readLines().each { line ->
            def match = line.trim() =~ /^(\S+)\s+(device|offline|unauthorized|recovery|sideload|bootloader)(?:\s.*)?$/
            if (match.matches()) {
                if (match[0][2] == 'device') {
                    devices.add(match[0][1])
                } else {
                    logger.lifecycle("Skipping device ${match[0][1]}: ${match[0][2]}")
                }
            }
        }
        if (devices.isEmpty()) {
            throw new GradleException('No online authorized devices. Connect a device and authorize USB debugging, then retry.')
        }

        def failures = []
        devices.each { serial ->
            logger.lifecycle("Installing on ${serial} ...")
            def output = new ByteArrayOutputStream()
            try {
                def result = execOperations.exec {
                    commandLine adbFile.get().asFile.absolutePath, '-s', serial,
                            'install', '-r', apkFile.get().asFile.absolutePath
                    standardOutput = output
                    errorOutput = output
                    ignoreExitValue = true
                }
                logger.lifecycle(output.toString('UTF-8').trim())
                if (result.exitValue != 0) {
                    failures.add(serial)
                }
            } catch (Exception exception) {
                failures.add(serial)
                logger.error("Installation failed on ${serial}: ${exception.message}")
            }
        }
        logger.lifecycle("Installation complete: ${devices.size() - failures.size()} succeeded, ${failures.size()} failed.")
        if (!failures.isEmpty()) {
            throw new GradleException("Installation failed on: ${failures.join(', ')}")
        }
    }
}

tasks.register('install', InstallAllDevices) {
    group = 'install'
    description = '构建 APK 并覆盖安装到全部在线且已授权的设备。'
    dependsOn tasks.named('copyApk')
    adbFile.set(androidComponents.sdkComponents.adb)
    apkFile.set(layout.buildDirectory.file('apk/PokeMMO.apk'))
    timeout = java.time.Duration.ofMinutes(10)
}
