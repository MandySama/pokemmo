plugins {
    id 'java-library'
}

group = rootProject.group
version = rootProject.version
repositories { mavenCentral() }
java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    api project(':server:login')
    api project(':server:game')
    api project(':client:twl')
    api "com.badlogicgames.gdx:gdx:${rootProject.gdxVersion}"
    implementation "com.badlogicgames.gdx:gdx-freetype:${rootProject.gdxVersion}"
}
