<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title></title><link rel="stylesheet" href="relations.css"></head>
<body>
<header><div><h1 data-t="title"></h1><small data-t="subtitle"></small></div><nav>
<a href="index.html" data-t="mapViewer"></a>
<button id="undo" data-t="undo"></button><button id="redo" data-t="redo"></button>
<button id="save" class="primary" data-t="save"></button>
<label class="button"><span data-t="import"></span><input id="import" type="file" accept=".json,application/json" hidden></label>
<button id="reset" data-t="reset"></button></nav></header>
<div id="status" role="status" aria-live="polite"></div>
<main><aside class="sources">
<h2 data-t="source"></h2><label><span data-t="map"></span><select id="map"></select></label>
<div id="mapPreview"><img id="mapImage" alt=""><div id="mapMarkers"></div></div>
<button id="mapScope" data-t="allMap"></button>
<h3 data-t="scope"></h3><div id="scope"></div>
<label><span data-t="search"></span><input id="search"></label>
<select id="kind"></select><div id="sourceList"></div>
<details><summary data-t="hidden"></summary><div id="hiddenList"></div></details>
<small id="coverage"></small>
</aside>
<section class="workspace"><div class="toolbar"><label><span data-t="zoom"></span><select id="zoom"><option value="0.5">50%</option><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option></select></label>
<label><input id="reverse" type="checkbox"><span data-t="reverse"></span></label>
<button id="layout" data-t="layout"></button><button id="more" data-t="more"></button><span id="graphCount"></span></div>
<div id="viewport" tabindex="0"><div id="sizer"><div id="canvas"><svg id="wires" xmlns="http://www.w3.org/2000/svg"></svg><div id="graphNodes"></div></div></div></div>
<p class="hint" data-t="hint"></p></section>
<aside class="inspector"><h2 data-t="selection"></h2><div id="selection"></div>
<label><span data-t="group"></span><input id="group"></label><label><span data-t="note"></span><textarea id="note" rows="4"></textarea></label>
<button id="remove" class="danger" data-t="remove"></button><button id="restoreNode" data-t="restoreNode"></button>
<h3 data-t="links"></h3><div id="links"></div>
<details open><summary data-t="raw"></summary><pre id="raw"></pre></details>
</aside></main>
<script src="relations-data.js"></script><script src="relations.js"></script>
</body></html>
